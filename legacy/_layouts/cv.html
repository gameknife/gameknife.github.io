<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    {% include theme.html %}

    <!-- 浏览器「另存为 PDF」会用 document.title 作为默认文件名 -->
    <title>{{ site.data.cv.basics.name_en }} CV</title>
    <meta name="description" content="{{ site.data.cv.basics.name_en }} — {{ site.data.cv.basics.headline }}">
    <meta name="robots" content="index, follow">

    <link rel="stylesheet" type="text/css" href="{{ "/cv.css" | relative_url }}">
    <link rel="stylesheet" type="text/css" href="{{ "/theme.css" | relative_url }}">
    <link rel="canonical" href="{{ page.url | prepend: site.baseurl | prepend: site.url }}">
</head>
<body class="cv-body">

    <div class="cv-toolbar no-print">
        <div class="cv-toolbar__inner">
            <a class="cv-toolbar__back" href="{{ "/resume/" | relative_url }}">&larr; 完整简历</a>
            <div class="cv-toolbar__actions">
                <span class="cv-toolbar__hint">A4 · 关闭「页眉和页脚」效果最佳</span>
                <button type="button" class="cv-toolbar__btn" onclick="downloadPdf()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                    <span>下载 PDF</span>
                </button>
            </div>
        </div>
    </div>

    <main class="cv-sheet">
        {{ content }}
    </main>

    <p class="cv-footnote no-print">
        点击「下载 PDF」后，在打印对话框中把目标打印机选为 <strong>「另存为 PDF」</strong>
        （Save as PDF / Microsoft Print to PDF），纸张 A4、缩放默认、取消勾选页眉和页脚即可。
        导出的 PDF 是矢量文字，可搜索、可复制、体积很小。
    </p>

    <script>
        // DOM 加载完成后，如果检测到是默认占位符，则将其从 DOM 中移除（避免公开显示）
        document.addEventListener('DOMContentLoaded', function () {
            var phoneEl = document.getElementById('cv-phone');
            if (phoneEl && (phoneEl.textContent.indexOf('1XX-XXXX-XXXX') !== -1 || phoneEl.textContent.trim() === '')) {
                phoneEl.remove();
            }
            var wechatEl = document.getElementById('cv-wechat');
            if (wechatEl && (wechatEl.textContent.indexOf('微信账号') !== -1 || wechatEl.textContent.trim() === '')) {
                wechatEl.remove();
            }
        });

        // 点击下载按钮时的逻辑
        function downloadPdf() {
            var contactList = document.querySelector('.cv-contact');
            if (!contactList) {
                window.print();
                return;
            }

            var phone = prompt("请输入您的联系电话（留空将不显示）：");
            if (phone !== null) {
                var phoneEl = document.getElementById('cv-phone');
                if (phone.trim() !== '') {
                    if (!phoneEl) {
                        phoneEl = document.createElement('li');
                        phoneEl.id = 'cv-phone';
                        contactList.insertBefore(phoneEl, contactList.firstChild);
                    }
                    phoneEl.textContent = phone;
                    phoneEl.style.display = '';
                } else if (phoneEl) {
                    phoneEl.remove();
                }
            }

            var wechat = prompt("请输入您的微信账号（留空将不显示）：");
            if (wechat !== null) {
                var wechatEl = document.getElementById('cv-wechat');
                if (wechat.trim() !== '') {
                    if (!wechatEl) {
                        wechatEl = document.createElement('li');
                        wechatEl.id = 'cv-wechat';
                        // 插入在电话后面，或者最前面
                        var phoneEl = document.getElementById('cv-phone');
                        if (phoneEl && phoneEl.nextSibling) {
                            contactList.insertBefore(wechatEl, phoneEl.nextSibling);
                        } else {
                            contactList.insertBefore(wechatEl, contactList.firstChild);
                        }
                    }
                    wechatEl.textContent = "微信: " + wechat;
                    wechatEl.style.display = '';
                } else if (wechatEl) {
                    wechatEl.remove();
                }
            }

            // 触发打印对话框
            window.print();
        }

        // 从简历页带 ?print=1 进来时直接触发
        if (window.location.search.indexOf('print=1') !== -1) {
            window.addEventListener('load', function () {
                window.setTimeout(downloadPdf, 300);
            });
        }
    </script>

</body>
</html>
