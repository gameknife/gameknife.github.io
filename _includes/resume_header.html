<header class="no-print">
    <div class="container">
        <div class="intro">
            <p class="intro__pre">Hello</p>
            <p class="intro__main">My name is <span>{{ site.name }}</span>, a {{ site.job }} who loves all things {{ site.languages }}</p>
            <p class="intro__post">{{ site.location }}</p>
            <div class="social">
                {% if site.github_username %}<a href="http://github.com/{{ site.github_username }}" target="_blank">GitHub</a>{% endif %}
                {% if site.email_address %}<a href="mailto:{{ site.email_address }}" target="_blank">Email</a>{% endif %}
            </div>
            <div class="resume-actions">
                <a class="cv-link-btn" href="{{ "/cv/" | relative_url }}">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                    <span>标准简历 / 下载 PDF</span>
                </a>
            </div>
        </div>
    </div>
</header>
